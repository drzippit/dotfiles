# External Monitor Only Configuration
# Static configuration for using only external display

# Disable laptop screen, use external only
monitor=eDP-1,disable
monitor=desc:Philips Consumer Electronics Company PHL 346B1C 0x00002FE5,3440x1440@59.97,0x0,1.0

# Workspace assignment - all on external
workspace = 1,monitor:desc:Philips Consumer Electronics Company PHL 346B1C 0x00002FE5,default:true

# Extra autostart processes
# exec-once = uwsm app -- my-service
exec-once = uwsm app -- 1password --silent
exec-once = uwsm app -- waypaper --restore
exec-once = uwsm app -- /usr/bin/pypr
exec-once = uwsm app -- wl-paste --watch cliphist store
exec-once = uwsm app -- hyprdynamicmonitors --disable-power-events --enable-lid-events
exec-once = uwsm app -- hyprfloat
